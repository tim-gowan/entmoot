# License policy for shipped (non-dev) dependencies.
# Run: cargo deny --all-features --exclude-dev check licenses advisories
# Anything not in `allow` fails (includes GPL/AGPL/LGPL/CC-BY-SA).
# Identity crate bans stay in Cargo.toml / Python + Dylint — not here.

[graph]
all-features = false
no-default-features = false

[advisories]
ignore = []

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    # Rust Analyzer's Linux file watcher (inotify / inotify-sys).
    "ISC",
    "0BSD",
    "Unlicense",
    "Zlib",
    "CC0-1.0",
    "MIT-0",
    "Unicode-3.0",
    # Weak copyleft used by a small transitive set; not GPL/LGPL/AGPL.
    "MPL-2.0",
]
exceptions = []

[licenses.private]
# Only intentionally private tooling crates are excluded; release packages are licensed above.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
