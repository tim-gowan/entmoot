name: CI
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
env:
  CARGO_BUILD_JOBS: 2
  PYTHONUTF8: '1'
jobs:
  structural:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: rustup show
      - run: python -m pip install -r evals/harness/requirements.txt
      - run: cargo test --workspace --locked --features entmoot-core/full-tests
      - run: cargo test --locked -p entmoot --test campaign_harness -- --ignored
      - run: cargo test --locked -p entmoot-engine --test revision_receipts campaign_accounting -- --ignored
      - run: python -m unittest discover -s scripts -p "test_*.py"
      - run: python scripts/check_release.py
      - run: python scripts/package_smoke.py
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup show
      - run: cargo fmt --all -- --check
      - run: python3 scripts/prepare_release_inputs.py --check
      - run: cargo clippy --workspace --locked --all-targets --features entmoot-core/full-tests -- -D warnings
      - run: cargo clippy -p entmoot --locked --features producer --all-targets -- -D warnings
      - run: |
          cargo install cargo-dylint dylint-link --version 6.1.1 --locked
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install cargo-machete --version 0.9.1 --locked
      - run: python3 scripts/pre_commit_check.py --banned-only
      - run: cargo deny --exclude-dev check advisories
      - run: cargo deny --all-features --exclude-dev check licenses advisories
