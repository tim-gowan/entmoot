# Phased coverage (this workflow):
#   structural — compiler-free inventory, crate unit/integration, packaging smoke
#   policy     — fmt/clippy/deny (orthogonal to coverage claims)
#   repo       — scripts/utilities unit tests only (no adapters, no remote corpora)
# Docs staging lives in docs.yml (.tmp/staging). Resolved: native.yml. Demo: demo.yml.
# release.yml calls this file by path; do not rename. Never path-skip correctness here.
name: CI
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
env:
  CARGO_BUILD_JOBS: 2
  PYTHONUTF8: '1'
  PYTHON_VERSION: '3.13'
  ARTIFACT_RETENTION_DAYS: '14'
  EVALS_REQUIREMENTS: evals/harness/requirements.txt
  FULL_TESTS_FEATURES: entmoot-core/full-tests
jobs:
  structural:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 65
    env:
      RUST_CACHE_KEY: structural-${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.EVALS_REQUIREMENTS }}
      - run: rustup show
      - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          shared-key: ${{ env.RUST_CACHE_KEY }}
          cache-targets: true
      - run: python -m pip install -r "${{ env.EVALS_REQUIREMENTS }}"
      - run: cargo test --workspace --locked --features ${{ env.FULL_TESTS_FEATURES }}
      - run: cargo test --locked -p entmoot --test campaign_harness -- --ignored
      - run: cargo test --locked -p entmoot-engine --test revision_receipts campaign_accounting -- --ignored
      - run: python scripts/check_release.py
      - run: python scripts/package_smoke.py
      - name: Build release CLI
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked -p entmoot
          mkdir -p .tmp/cli-artifact
          if [ -f target/release/entmoot.exe ]; then
            cp target/release/entmoot.exe .tmp/cli-artifact/entmoot.exe
          else
            cp target/release/entmoot .tmp/cli-artifact/entmoot
          fi
      - name: Upload packaged crates
        if: runner.os == 'Linux' && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: entmoot-crates-${{ github.sha }}
          path: target/package/*.crate
          if-no-files-found: error
          retention-days: ${{ fromJSON(env.ARTIFACT_RETENTION_DAYS) }}
      - name: Upload release CLI
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: entmoot-cli-${{ runner.os }}-${{ github.sha }}
          path: .tmp/cli-artifact/*
          if-no-files-found: error
          retention-days: ${{ fromJSON(env.ARTIFACT_RETENTION_DAYS) }}
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUST_CACHE_KEY: policy-ubuntu
      PRODUCER_FEATURES: producer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          shared-key: ${{ env.RUST_CACHE_KEY }}
          cache-targets: true
      - run: cargo fmt --all -- --check
      - run: python3 scripts/prepare_release_inputs.py --check
      - run: cargo clippy --workspace --locked --all-targets --features ${{ env.FULL_TESTS_FEATURES }} -- -D warnings
      - run: cargo clippy -p entmoot --locked --features ${{ env.PRODUCER_FEATURES }} --all-targets -- -D warnings
      - uses: taiki-e/install-action@899b013517f9e7774591216672bf75a46bb9a481 # v2.9.4
        with:
          tool: cargo-dylint@6.1.1,dylint-link@6.1.1,cargo-deny@0.20.2,cargo-machete@0.9.1
      - run: python3 scripts/pre_commit_check.py --banned-only
      - run: cargo deny --exclude-dev check advisories
      - run: cargo deny --all-features --exclude-dev check licenses advisories
  repo:
    # Coverage: scripts/utilities unit tests only. No adapters, no remote corpora.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.EVALS_REQUIREMENTS }}
      - run: python -m pip install -r "${{ env.EVALS_REQUIREMENTS }}"
      - run: python -m unittest discover -s scripts -p "test_*.py"
