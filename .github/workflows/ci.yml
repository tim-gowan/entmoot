name: CI
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
env:
  CARGO_BUILD_JOBS: 2
  PYTHONUTF8: '1'
jobs:
  structural:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: rustup show
      - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          shared-key: structural-${{ matrix.os }}
          cache-targets: true
      - run: python -m pip install -r evals/harness/requirements.txt
      - run: cargo test --workspace --locked --features entmoot-core/full-tests
      - run: cargo test --locked -p entmoot --test campaign_harness -- --ignored
      - run: cargo test --locked -p entmoot-engine --test revision_receipts campaign_accounting -- --ignored
      - run: python -m unittest discover -s scripts -p "test_*.py"
      - run: python scripts/check_release.py
      - run: python scripts/package_smoke.py
      - name: Upload packaged crates
        if: runner.os == 'Linux' && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: entmoot-crates-${{ github.sha }}
          path: target/package/*.crate
          if-no-files-found: error
          retention-days: 14
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          shared-key: policy-ubuntu
          cache-targets: true
      - run: cargo fmt --all -- --check
      - run: python3 scripts/prepare_release_inputs.py --check
      - run: cargo clippy --workspace --locked --all-targets --features entmoot-core/full-tests -- -D warnings
      - run: cargo clippy -p entmoot --locked --features producer --all-targets -- -D warnings
      - uses: taiki-e/install-action@899b013517f9e7774591216672bf75a46bb9a481 # v2.9.4
        with:
          tool: cargo-dylint@6.1.1,dylint-link@6.1.1,cargo-deny@0.20.2,cargo-machete@0.9.1
      - run: python3 scripts/pre_commit_check.py --banned-only
      - run: cargo deny --exclude-dev check advisories
      - run: cargo deny --all-features --exclude-dev check licenses advisories
