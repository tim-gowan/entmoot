name: Documentation
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup show
      - run: python3 -m pip install -r docs/requirements.txt
      - run: cargo build --locked -p entmoot -p entmoot-mcp
      - run: cargo doc --workspace --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: python3 scripts/build_docs.py --cli target/debug/entmoot --mcp target/debug/entmoot-mcp --out .tmp/site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .tmp/site
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
