# Build once from this run's qualified binaries; release.yml deploys this artifact.
# Linux environment assembly is discrete via .github/actions/assemble-ci-env.
name: Documentation
on:
  workflow_call:
    inputs:
      binaries_artifact:
        description: Qualified Linux test-profile CLI/MCP from this workflow run
        type: string
        required: true
  workflow_dispatch:
    inputs:
      binaries_artifact:
        description: Qualified Linux test-profile CLI/MCP artifact name
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
env:
  CARGO_BUILD_JOBS: 2
  PYTHONUTF8: '1'
  PYTHON_VERSION: '3.13'
  ARTIFACT_RETENTION_DAYS: '14'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/assemble-ci-env
        with:
          lane: docs
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          shared-key: docs-ubuntu
          cache-targets: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.binaries_artifact }}
          path: .tmp/bin-artifact
      - run: chmod +x .tmp/bin-artifact/entmoot .tmp/bin-artifact/entmoot-mcp
      - run: cargo doc --workspace --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Build site
        env:
          DOCS_OUT_DIR: .tmp/staging
        run: python3 scripts/build_docs.py --cli .tmp/bin-artifact/entmoot --mcp .tmp/bin-artifact/entmoot-mcp --out "${DOCS_OUT_DIR}"
      - name: Upload staging artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-staging-${{ github.sha }}
          path: .tmp/staging
          if-no-files-found: error
          retention-days: ${{ fromJSON(env.ARTIFACT_RETENTION_DAYS) }}
