# Shared docs pipeline: CI stages under .tmp/staging; CD (after release publish) may deploy Pages.
# Parameterized for workflow_call reuse. Filename kept for callers.
name: Documentation
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      out_dir:
        description: "Docs output directory (.tmp/staging for CI, .tmp/site for CD deploy)"
        type: string
        required: false
        default: '.tmp/staging'
      upload_pages:
        description: "Upload GitHub Pages artifact (CD only)"
        type: boolean
        required: false
        default: false
      deploy:
        description: "Deploy Pages when PAGES_ENABLED (after successful release)"
        type: boolean
        required: false
        default: false
      staging_artifact:
        description: "Upload ordinary staging artifact (CI)"
        type: boolean
        required: false
        default: true
      artifact_name:
        description: "Staging artifact name prefix when staging_artifact is true"
        type: string
        required: false
        default: 'docs-staging'
      rust_cache_key:
        description: "Swatinem/rust-cache shared-key"
        type: string
        required: false
        default: 'docs-ubuntu'
permissions:
  contents: read
concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}-${{ inputs.upload_pages || false }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
env:
  CARGO_BUILD_JOBS: 2
  PYTHONUTF8: '1'
  PYTHON_VERSION: '3.13'
  ARTIFACT_RETENTION_DAYS: '14'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Resolve docs parameters
        id: cfg
        env:
          EVENT_NAME: ${{ github.event_name }}
          IN_OUT: ${{ inputs.out_dir }}
          IN_UPLOAD_PAGES: ${{ inputs.upload_pages }}
          IN_DEPLOY: ${{ inputs.deploy }}
          IN_STAGING: ${{ inputs.staging_artifact }}
          IN_ARTIFACT: ${{ inputs.artifact_name }}
          IN_CACHE: ${{ inputs.rust_cache_key }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_call" ]; then
            out="${IN_OUT:-.tmp/staging}"
            upload_pages="${IN_UPLOAD_PAGES:-false}"
            deploy="${IN_DEPLOY:-false}"
            staging="${IN_STAGING:-true}"
            artifact="${IN_ARTIFACT:-docs-staging}"
            cache="${IN_CACHE:-docs-ubuntu}"
          else
            # CI / PR: stage only under .tmp/staging (no Pages deploy).
            out=".tmp/staging"
            upload_pages="false"
            deploy="false"
            staging="true"
            artifact="docs-staging"
            cache="docs-ubuntu"
          fi
          {
            echo "out_dir=${out}"
            echo "upload_pages=${upload_pages}"
            echo "deploy=${deploy}"
            echo "staging_artifact=${staging}"
            echo "artifact_name=${artifact}"
            echo "rust_cache_key=${cache}"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: rustup show
      - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          shared-key: ${{ steps.cfg.outputs.rust_cache_key }}
          cache-targets: true
      - run: python3 -m pip install -r docs/requirements.txt
      - run: cargo build --locked -p entmoot -p entmoot-mcp
      - run: cargo doc --workspace --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Build site
        env:
          DOCS_OUT_DIR: ${{ steps.cfg.outputs.out_dir }}
        run: python3 scripts/build_docs.py --cli target/debug/entmoot --mcp target/debug/entmoot-mcp --out "${DOCS_OUT_DIR}"
      - name: Upload staging artifact
        if: steps.cfg.outputs.staging_artifact == 'true' && steps.cfg.outputs.upload_pages != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.cfg.outputs.artifact_name }}-${{ github.sha }}
          path: ${{ steps.cfg.outputs.out_dir }}
          if-no-files-found: error
          retention-days: ${{ fromJSON(env.ARTIFACT_RETENTION_DAYS) }}
      - name: Upload Pages artifact
        if: steps.cfg.outputs.upload_pages == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ steps.cfg.outputs.out_dir }}
  deploy:
    if: github.event_name == 'workflow_call' && inputs.deploy && vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
