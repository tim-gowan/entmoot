# Opt-in structural corpus demo. Not a release gate; must not be required by release.yml.
# Prefers the release CLI artifact from ci.yml; falls back to a local release build.
name: Corpus demo
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref whose CI CLI artifact to prefer (default branch tip if empty)"
        required: false
        type: string
        default: ''
      run_id:
        description: "Optional Actions run id that uploaded entmoot-cli-Linux-<sha>"
        required: false
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: demo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_BUILD_JOBS: 2
  PYTHONUTF8: '1'
jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: evals/harness/requirements.txt
      - run: python -m pip install -r evals/harness/requirements.txt
      - name: Isolate durable state
        run: |
          set -euo pipefail
          echo "ENTMOOT_DATA_DIR=${RUNNER_TEMP}/entmoot-demo-home" >> "$GITHUB_ENV"
      - name: Obtain release CLI
        id: cli
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/demo/cli
          SHA="$(git rev-parse HEAD)"
          ARTIFACT="entmoot-cli-Linux-${SHA}"
          got=0
          if [ -n "${INPUT_RUN_ID}" ]; then
            if gh run download "${INPUT_RUN_ID}" --name "${ARTIFACT}" --dir .tmp/demo/cli; then
              got=1
            fi
          else
            REF="${INPUT_REF:-${{ github.event.repository.default_branch }}}"
            RUN_ID="$(gh run list --workflow=ci.yml --branch "${REF}" --status success --limit 20 --json databaseId,headSha \
              --jq ".[] | select(.headSha==\"${SHA}\") | .databaseId" | head -n1 || true)"
            if [ -z "${RUN_ID}" ]; then
              RUN_ID="$(gh run list --workflow=CI --branch "${REF}" --status success --limit 20 --json databaseId,headSha \
                --jq ".[] | select(.headSha==\"${SHA}\") | .databaseId" | head -n1 || true)"
            fi
            if [ -n "${RUN_ID}" ]; then
              if gh run download "${RUN_ID}" --name "${ARTIFACT}" --dir .tmp/demo/cli; then
                got=1
              fi
            fi
          fi
          BIN="$(find .tmp/demo/cli -type f -name entmoot | head -n1 || true)"
          if [ "${got}" = "1" ] && [ -n "${BIN}" ]; then
            chmod +x "${BIN}"
            echo "path=${GITHUB_WORKSPACE}/${BIN}" >> "$GITHUB_OUTPUT"
            echo "need_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "CI CLI artifact unavailable; building release binary"
            echo "need_build=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        if: steps.cli.outputs.need_build == 'true'
        with:
          shared-key: structural-Linux
          cache-targets: true
      - name: Build release CLI fallback
        if: steps.cli.outputs.need_build == 'true'
        id: build
        run: |
          set -euo pipefail
          rustup show
          cargo build --release --locked -p entmoot
          echo "path=${GITHUB_WORKSPACE}/target/release/entmoot" >> "$GITHUB_OUTPUT"
      - name: Resolve CLI path
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ steps.cli.outputs.need_build }}" = "true" ]; then
            echo "path=${{ steps.build.outputs.path }}" >> "$GITHUB_OUTPUT"
          else
            echo "path=${{ steps.cli.outputs.path }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Run structural getrandom campaign
        env:
          CLI_PATH: ${{ steps.resolve.outputs.path }}
        run: |
          set -euo pipefail
          test -n "${CLI_PATH}"
          test -x "${CLI_PATH}"
          python -m evals.harness.repository_campaign run \
            --config evals/demo/getrandom-structural.json \
            --run-dir .tmp/demo/run \
            --cli "${CLI_PATH}" \
            --depth 0 \
            --structural-only
      - name: Upload demo receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: demo-getrandom-structural
          path: .tmp/demo/run
          if-no-files-found: ignore
          retention-days: 14
