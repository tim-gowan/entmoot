name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  native:
    uses: ./.github/workflows/native.yml
  docs:
    uses: ./.github/workflows/docs.yml
  publish:
    needs: [ci, native, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: crates-io
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup show
      - run: python3 scripts/check_release.py --tag "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Obtain short-lived crates.io credential
        id: auth
        if: vars.CRATES_IO_TRUSTED_PUBLISHING == 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
      - name: Publish in dependency order and verify registry installation
        run: python3 scripts/publish_release.py
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
      - name: Create prerelease with the tested source packages
        run: gh release create "$RELEASE_TAG" target/package/*.crate --verify-tag --prerelease --generate-notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
