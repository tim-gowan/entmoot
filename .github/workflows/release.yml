# Sole CD path: tag v* → CI + native + docs → GitHub Release + crates.io → Pages.
# Configure crates.io Trusted Publishing against this workflow and environment `crates-io`.
# Docs must build before publishing; optional Pages deployment follows publication.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  PYTHONUTF8: '1'
  PYTHON_VERSION: '3.13'
  RUST_CACHE_KEY: release-ubuntu
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  native:
    uses: ./.github/workflows/native.yml
  publish:
    name: GitHub Release and crates.io
    needs: [ci, native]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: crates-io
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: rustup show
      - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          shared-key: ${{ env.RUST_CACHE_KEY }}
          cache-targets: true
      - run: python3 scripts/check_release.py --tag "$RELEASE_TAG"
      - name: Refuse if any crate version already on crates.io
        run: |
          set -euo pipefail
          VERSION="$(python3 - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8"))["workspace"]["package"]["version"])
          PY
          )"
          for name in entmoot-contracts entmoot-core entmoot-engine entmoot entmoot-mcp; do
            CODE="$(curl -sS -o /dev/null -w '%{http_code}' \
              -H 'User-Agent: entmoot-release-ci (github.com/tim-gowan/entmoot)' \
              "https://crates.io/api/v1/crates/${name}/${VERSION}")"
            echo "crates.io status for ${name}@${VERSION}: ${CODE}"
            if [ "$CODE" = "200" ]; then
              echo "Version already published; refusing duplicate upload"
              exit 1
            fi
            if [ "$CODE" != "404" ]; then
              echo "Unexpected crates.io response; refusing to continue"
              exit 1
            fi
          done
      # Already qualified by CI at this exact tag; publication still performs
      # cargo publish verification and a clean registry installation.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: entmoot-crates-${{ github.sha }}
          path: target/package
      - name: Create GitHub Release with packaged crates
        run: |
          set -euo pipefail
          VERSION="$(python3 - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8"))["workspace"]["package"]["version"])
          PY
          )"
          PRERELEASE_ARGS=()
          case "$VERSION" in
            *-alpha*|*-beta*|*-rc*) PRERELEASE_ARGS=(--prerelease) ;;
          esac
          gh release create "$RELEASE_TAG" target/package/*.crate \
            --verify-tag "${PRERELEASE_ARGS[@]}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Obtain short-lived crates.io credential
        id: auth
        if: vars.CRATES_IO_TRUSTED_PUBLISHING == 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
      - name: Publish in dependency order and verify registry installation
        run: python3 scripts/publish_release.py
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
  deploy_docs:
    name: Documentation (post-publish)
    if: vars.PAGES_ENABLED == 'true'
    needs: [publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docs-staging-${{ github.sha }}
          path: .tmp/site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .tmp/site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
