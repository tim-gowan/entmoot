# Manual dry-run / bootstrap gate only. Primary CD is release.yml on tag v*.
# Default publish=false: validate packaging and report whether crates.io would accept.
# Forced publish=true is emergency bootstrap only—does not create a GitHub Release.
#
# Trusted Publishing for routine releases must target release.yml + environment crates-io.
# See docs/runbooks/local-alpha.md

name: Publish to crates.io (dry-run / bootstrap)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Expected workspace.package.version (e.g. 0.0.1-alpha)"
        required: true
        type: string
      publish:
        description: "Emergency crates.io upload (false = gate only; prefer release.yml tags)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-crates-io
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  PYTHONUTF8: '1'

jobs:
  classify:
    name: Classify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.out.outputs.version }}
      publish: ${{ steps.out.outputs.publish }}
    steps:
      - name: Resolve version and publish flag
        id: out
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          PUBLISH="${{ inputs.publish }}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Refusing non-semver version: ${VERSION}"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "publish=${PUBLISH}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION} publish=${PUBLISH}"
          if [ "$PUBLISH" = "true" ]; then
            echo "::warning::Forced publish bypasses GitHub Release; prefer tagging for release.yml CD"
          fi

  gate:
    name: Validate packaging (dry-run)
    runs-on: ubuntu-latest
    needs: classify
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: rustup show
      - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          shared-key: publish-gate-ubuntu
          cache-targets: true
      - name: Assert workspace version
        run: |
          set -euo pipefail
          VERSION="$(python3 - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8"))["workspace"]["package"]["version"])
          PY
          )"
          echo "workspace version=${VERSION}"
          test "$VERSION" = "${{ needs.classify.outputs.version }}"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --locked --all-targets --features entmoot-core/full-tests -- -D warnings
      - run: python3 scripts/check_release.py
      - run: python3 scripts/package_smoke.py
      - name: Report crates.io availability
        run: |
          set -euo pipefail
          VERSION="${{ needs.classify.outputs.version }}"
          for name in entmoot-contracts entmoot-core entmoot-engine entmoot entmoot-mcp; do
            CODE="$(curl -sS -o /dev/null -w '%{http_code}' \
              -H 'User-Agent: entmoot-publish-ci (github.com/tim-gowan/entmoot)' \
              "https://crates.io/api/v1/crates/${name}/${VERSION}")"
            echo "crates.io status for ${name}@${VERSION}: ${CODE}"
            if [ "$CODE" = "200" ]; then
              echo "Version already published; dry-run would refuse upload"
              if [ "${{ needs.classify.outputs.publish }}" = "true" ]; then
                exit 1
              fi
            elif [ "$CODE" != "404" ]; then
              echo "Unexpected crates.io response; refusing to continue"
              exit 1
            fi
          done
          echo "Dry-run OK. Tag v${VERSION} and use release.yml for GitHub Release + crates.io."

  bootstrap:
    name: Emergency crates.io bootstrap
    runs-on: ubuntu-latest
    needs: [classify, gate]
    if: needs.classify.outputs.publish == 'true'
    environment: crates-io
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: rustup show
      - name: Authenticate to crates.io (OIDC)
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
      - name: Publish in dependency order and verify registry installation
        run: python3 scripts/publish_release.py
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
