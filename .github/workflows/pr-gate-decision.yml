name: PR gate decision (acceleration)

# Advisory structural classification using a qualified binary. Not a merge oracle.
# Full ci.yml remains the correctness backstop.

on:
  workflow_call:
    inputs:
      binaries_artifact:
        description: Qualified Linux test-profile binaries from this workflow run
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: pr-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate-decision:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve base and head SHAs
        id: shas
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="$PR_BASE"
          HEAD="$PR_HEAD"
          [[ "$BASE" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'base must be a full commit SHA'; exit 2; }
          [[ "$HEAD" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'head must be a full commit SHA'; exit 2; }
          git cat-file -e "$BASE^{commit}"
          git cat-file -e "$HEAD^{commit}"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
          echo "Comparing $BASE...$HEAD"

      - name: Path preflight (no CLI)
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/pr_structural_diff.py \
            --path-preflight \
            --base "${{ steps.shas.outputs.base }}" \
            --head "${{ steps.shas.outputs.head }}" \
            --json-out pr_gate_decision.json \
            --summary-out pr_gate_decision.md
          SKIP=$(python3 -c "import json; print('true' if json.load(open('pr_gate_decision.json'))['skip_cli_build'] else 'false')")
          echo "skip_cli_build=$SKIP" >> "$GITHUB_OUTPUT"
          cat pr_gate_decision.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload gate decision (preflight skip)
        if: steps.preflight.outputs.skip_cli_build == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-gate-decision
          path: |
            pr_gate_decision.json
            pr_gate_decision.md

      - name: Download qualified binaries from this run
        if: steps.preflight.outputs.skip_cli_build != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.binaries_artifact }}
          path: .tmp/bin-artifact

      - name: Structural classification + gate decisions
        if: steps.preflight.outputs.skip_cli_build != 'true'
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          CLI=./.tmp/bin-artifact/entmoot
          chmod +x "$CLI"
          python3 scripts/pr_structural_diff.py \
            --base "${{ steps.shas.outputs.base }}" \
            --head "${{ steps.shas.outputs.head }}" \
            --cli "$CLI" \
            --config v1 \
            --json-out pr_gate_decision.json \
            --summary-out pr_gate_decision.md
          cat pr_gate_decision.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload gate decision artifact
        if: steps.preflight.outputs.skip_cli_build != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-gate-decision
          path: |
            pr_gate_decision.json
            pr_gate_decision.md
