[package]
name = "entmoot-mcp"
version.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
edition = "2021"
description = "MCP transport for Entmoot evidence queries and explicit analysis work"
license = "MIT OR Apache-2.0"

[[bin]]
name = "entmoot-mcp"
path = "src/main.rs"

[dependencies]
entmoot-contracts = { version = "=0.0.1-alpha.1", path = "../entmoot-contracts" }
entmoot-engine = { version = "=0.0.1-alpha.1", path = "../entmoot-engine", default-features = false }
entmoot-core = { version = "=0.0.1-alpha.1", path = "../entmoot-core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
schemars = "1.0.4"
rmcp = { version = "=3.3.0", features = ["server", "transport-io", "transport-streamable-http-server"] }
# Later macro releases reference SDK APIs absent from 3.3.0.
rmcp-macros = "=3.3.0"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "io-std", "sync", "net", "signal"] }
clap = { version = "4.5.53", features = ["derive", "env"] }
anyhow = "1.0.100"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }

[dev-dependencies]
tempfile = "3.10.1"
rmcp = { version = "=3.3.0", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "stream"] }
tokio = { version = "1.48.0", features = ["process"] }

[package.metadata.cargo-machete]
# Proc-macro crate for #[tool] / #[tool_router]; machete does not see macro use.
ignored = ["rmcp-macros"]

[lints]
workspace = true
