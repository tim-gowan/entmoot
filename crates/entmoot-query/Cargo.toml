[package]
name = "entmoot-query"
version.workspace = true
repository.workspace = true
rust-version.workspace = true
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Read-only bounded navigation over retained publications. No producer dependencies."

[features]
default = []

[dependencies]
entmoot-contracts = { version = "=0.0.1-alpha.1", path = "../entmoot-contracts" }
entmoot-core = { version = "=0.0.1-alpha.1", path = "../entmoot-core" }
entmoot-store = { version = "=0.0.1-alpha.1", path = "../entmoot-store" }
entmoot-evidence = { version = "=0.0.1-alpha.1", path = "../entmoot-evidence" }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.148"
thiserror = "2.0.17"
blake3 = "1.8.2"
globset = "0.4.20"
rapidfuzz = "0.5.0"
tracing = "0.1.41"

[dev-dependencies]
rayon = "1.11.0"
tempfile = "3.10.1"
rusqlite = { version = "0.40.1", features = ["bundled"] }

[lints]
workspace = true
