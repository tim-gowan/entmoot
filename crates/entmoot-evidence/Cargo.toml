[package]
name = "entmoot-evidence"
version.workspace = true
repository.workspace = true
rust-version.workspace = true
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Provider normalization and evidence attachment."

[features]
default = []

[dependencies]
entmoot-contracts = { version = "=0.0.1-alpha.1", path = "../entmoot-contracts" }
entmoot-core = { version = "=0.0.1-alpha.1", path = "../entmoot-core" }
entmoot-store = { version = "=0.0.1-alpha.1", path = "../entmoot-store" }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.148"
thiserror = "2.0.17"
blake3 = "1.8.2"
tempfile = "3.10.1"

[dev-dependencies]
tempfile = "3.10.1"

[lints]
workspace = true
