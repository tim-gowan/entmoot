[package]
name = "entmoot"
default-run = "entmoot"
version.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "CLI orchestration for Entmoot"

[[bin]]
name = "entmoot"
path = "src/main.rs"

[[bin]]
name = "entmoot-producer"
path = "src/bin/entmoot_producer.rs"
required-features = ["producer"]

[features]
default = []
native-tests = []
producer = ["entmoot-workspace/resolved-rust-analyzer", "entmoot-workspace/resolved-oxc"]

[[test]]
name = "adapter_controls"
path = "tests/adapter_controls.rs"
required-features = ["native-tests", "producer"]

[[test]]
name = "program_adapters"
path = "tests/program_adapters.rs"
required-features = ["native-tests"]

[[test]]
name = "producer_cli"
path = "tests/producer_cli.rs"
required-features = ["producer"]

[dependencies]
entmoot-core = { version = "=0.0.1-alpha.1", path = "../entmoot-core" }
entmoot-contracts = { version = "=0.0.1-alpha.1", path = "../entmoot-contracts" }
entmoot-workspace = { version = "=0.0.1-alpha.1", path = "../entmoot-workspace" }
serde_json = "1.0.148"
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive", "env"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
indicatif = "0.18.0"

tempfile = "3.10.1"
rmcp = { version = "=3.3.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "stream"] }
tokio = { version = "1.48.0", features = ["rt-multi-thread"] }
serde = "1.0.228"

[dev-dependencies]
rusqlite = { version = "0.40.1", features = ["bundled"] }

[lints]
workspace = true

[dev-dependencies.entmoot-engine]
version = "=0.0.1-alpha.1"
path = "../entmoot-engine"
