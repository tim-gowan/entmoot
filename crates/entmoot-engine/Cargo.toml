[package]
name = "entmoot-engine"
version.workspace = true
repository.workspace = true
rust-version.workspace = true
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Compatibility facade for the Entmoot architecture split"

[features]
default = []
native-tests = ["entmoot-workspace/native-tests"]
resolved-rust-analyzer = ["entmoot-workspace/resolved-rust-analyzer"]
resolved-oxc = ["entmoot-workspace/resolved-oxc"]

[dependencies]
entmoot-workspace = { version = "=0.0.1-alpha.2", path = "../entmoot-workspace" }

[dev-dependencies]
entmoot-contracts = { version = "=0.0.1-alpha.2", path = "../entmoot-contracts" }
entmoot-core = { version = "=0.0.1-alpha.2", path = "../entmoot-core" }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.148"
tempfile = "3.10.1"
blake3 = "1.8.2"
rusqlite = { version = "0.40.1", features = ["bundled"] }

[lints]
workspace = true

[[example]]
name = "retain_campaign_publication"
test = true


[[test]]
name = "dispatch_expectations"
path = "tests/dispatch_expectations.rs"
required-features = ["native-tests", "resolved-rust-analyzer", "resolved-oxc"]

[[test]]
name = "callsites_c_family"
path = "tests/callsites_c_family.rs"
required-features = ["native-tests"]

[[test]]
name = "callsites_csharp"
path = "tests/callsites_csharp.rs"
required-features = ["native-tests"]

[[test]]
name = "callsites_go"
path = "tests/callsites_go.rs"
required-features = ["native-tests"]

[[test]]
name = "callsites_java"
path = "tests/callsites_java.rs"
required-features = ["native-tests"]

[[test]]
name = "callsites_rust"
path = "tests/callsites_rust.rs"
required-features = ["native-tests", "resolved-rust-analyzer"]

[[test]]
name = "callsites_javascript"
path = "tests/callsites_javascript.rs"
required-features = ["native-tests", "resolved-oxc"]
