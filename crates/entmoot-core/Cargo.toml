[package]
name = "entmoot-core"
version.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
edition = "2021"
authors = ["Tim Gowan <tgowan@endor.ai>"]
description = "Experimental Entmoot identity engine: structural hashes, ExactBodyId, logic addresses, markers"
license = "MIT OR Apache-2.0"
autotests = false

[features]
default = []
full-tests = []

[lib]
name = "entmoot_core"
path = "src/lib.rs"

[[test]]
name = "visitor_depth"
path = "tests/visitor_depth.rs"

[[test]]
name = "python_inventory"
path = "tests/python_inventory.rs"

[[test]]
name = "test_python"
path = "tests/test_python.rs"
required-features = ["full-tests"]

[[test]]
name = "test_java"
path = "tests/test_java.rs"
required-features = ["full-tests"]

[[test]]
name = "test_go"
path = "tests/test_go.rs"
required-features = ["full-tests"]

[[test]]
name = "test_javascript"
path = "tests/test_javascript.rs"
required-features = ["full-tests"]

[[test]]
name = "test_callable_parity"
path = "tests/test_callable_parity.rs"
required-features = ["full-tests"]

[[test]]
name = "test_typescript"
path = "tests/test_typescript.rs"
required-features = ["full-tests"]

[[test]]
name = "test_granular"
path = "tests/test_granular.rs"
required-features = ["full-tests"]

[[test]]
name = "test_logic_address"
path = "tests/test_logic_address.rs"

[[test]]
name = "test_index"
path = "tests/test_index.rs"

[[test]]
name = "test_analysis"
path = "tests/test_analysis.rs"
required-features = ["full-tests"]

[[test]]
name = "test_config_comparison"
path = "tests/test_config_comparison.rs"
required-features = ["full-tests"]

[[test]]
name = "test_csharp"
path = "tests/test_csharp.rs"
required-features = ["full-tests"]

[[test]]
name = "test_rust"
path = "tests/test_rust.rs"
required-features = ["full-tests"]

[[test]]
name = "c_family_inventory"
path = "tests/c_family_inventory.rs"

[dependencies]
entmoot-contracts = { version = "=0.0.1-alpha.1", path = "../entmoot-contracts" }

# Qualified parser bytes are generated by the maintainer bundle tool.
tree-sitter = "0.26.13"
tree-sitter-language = "0.1.8"

# Hashing
blake3 = "1.8.2"

# Parallelism
rayon = "1.11.0"

# Error handling
thiserror = "2.0.17"

# Serialization (if needed for configs)
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"

walkdir = "2.5.0"
ignore = "0.4.33"
stacker = "0.1"

[dev-dependencies]
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
# Testing frameworks
rstest = "0.26.1"              # Parameterized tests
proptest = "1.9.0"             # Property-based testing
mockall = "0.14.0"             # Mocking
test-case = "3.3.1"            # Test case macros
serial_test = "3.1.1"          # Serial test execution

# Assertion libraries
assert_matches = "1.5.0"       # Pattern matching assertions
pretty_assertions = "1.4.1"    # Better diff output
insta = "1.45.1"               # Snapshot testing

# Test utilities
tempfile = "3.10.1"            # Temporary files
criterion = { version = "0.8.1", features = ["html_reports"] }  # Benchmarks

# Coverage (via cargo-llvm-cov)
# Note: cargo-llvm-cov is installed via cargo install, not as dependency

[[bench]]
name = "hashing_bench"
harness = false

[[example]]
name = "granular_demo"
path = "examples/granular_demo.rs"

[[example]]
name = "hash_file"
path = "examples/hash_file.rs"

[package.metadata.cargo-machete]
# Referenced from build-generated grammar_bindings.rs (LanguageFn FFI).
ignored = ["tree-sitter-language"]

[lints]
workspace = true

[[test]]
name = "test_call_ports"
path = "tests/test_call_ports.rs"
required-features = ["full-tests"]

[[test]]
name = "declaration_initializers"
path = "tests/declaration_initializers.rs"

[[test]]
name = "code_contracts"
path = "tests/code_contracts.rs"

[[test]]
name = "revision_pairs"
path = "tests/revision_pairs.rs"

[[test]]
name = "grammar_bundle"
path = "tests/grammar_bundle.rs"

[build-dependencies]
blake3 = "1.8.2"
cc = { version = "1.4.6", features = ["parallel"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }

[[test]]
name = "file_revision_pairs"
path = "tests/file_revision_pairs.rs"

[[test]]
name = "code_similarity"
path = "tests/code_similarity.rs"
