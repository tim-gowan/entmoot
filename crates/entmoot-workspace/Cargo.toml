[package]
name = "entmoot-workspace"
version.workspace = true
repository.workspace = true
rust-version.workspace = true
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Local CLI/MCP composition and publication lifecycle."

[features]
default = []
native-tests = []
resolved-rust-analyzer = ["entmoot-native/resolved-rust-analyzer"]
resolved-oxc = ["entmoot-native/resolved-oxc"]

[dependencies]
entmoot-contracts = { version = "=0.0.1-alpha.2", path = "../entmoot-contracts" }
entmoot-core = { version = "=0.0.1-alpha.2", path = "../entmoot-core" }
entmoot-store = { version = "=0.0.1-alpha.2", path = "../entmoot-store" }
entmoot-query = { version = "=0.0.1-alpha.2", path = "../entmoot-query" }
entmoot-native = { version = "=0.0.1-alpha.2", path = "../entmoot-native" }
entmoot-ops = { version = "=0.0.1-alpha.2", path = "../entmoot-ops" }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.148"
blake3 = "1.8.2"
tempfile = "3.10.1"
tracing = "0.1.41"

[dev-dependencies]
rusqlite = { version = "0.40.1", features = ["bundled"] }
tempfile = "3.10.1"

[lints]
workspace = true
