# Spin up / down curl CMake CompDB generation via Docker Desktop (no host Ninja).
#
#   docker compose -f tools/resolver-adapters/clang/compdb/docker-compose.yml build
#   python scripts/prepare_curl_compdb.py --docker
#   docker compose -f tools/resolver-adapters/clang/compdb/docker-compose.yml down --rmi local
#
services:
  curl-compdb:
    build:
      context: .
      dockerfile: Dockerfile
    image: entmoot-curl-compdb:bookworm
    working_dir: /src
    volumes:
      # prepare_curl_compdb.py bind-mounts the private checkout at runtime.
      - ${ENTMOOT_COMPDB_HOST_SRC:-.}:/src
    environment:
      ENTMOOT_COMPDB_SRC: /src
    stdin_open: false
    tty: false
